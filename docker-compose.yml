services:
  downloader:
    build:
      context: .
      dockerfile: env/Dockerfile
    image: satellite-downloader:latest
    container_name: satellite-downloader
    gpus: all
    working_dir: /workspace
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      TORCH_HOME: /root/.cache/torch
      # NASA Earthdata credentials for MODIS/VIIRS Surface Reflectance downloads.
      # Set these on the host (or in a local .env picked up by docker compose),
      # never commit them. Alternatively use surface_reflectance.earthdata_env_path
      # (default ./key.env) or a mounted netrc file.
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
    volumes:
      - ./:/workspace
      - ${SATDL_HOST_DATA_PATH:-./data}:/host_data
      - satdl_model_cache:/root/.cache
      - satdl_model_data:/root/.local/share
    command: ["python3", "run.py", "--config", "config/config.yaml"]
    stdin_open: true
    tty: true
    shm_size: "8gb"

  # GCOM-C/SGLI (JAXA G-Portal) tools. Opt-in via the "gcomc" profile so the
  # default `downloader` service never depends on G-Portal settings. Run with:
  #   docker compose --env-file key.env --profile gcomc run --rm gcomc <command>
  # key.env (git-ignored) must define GPORTAL_USERNAME and
  # GPORTAL_PRIVATE_KEY_HOST_PATH (host path of the G-Portal SFTP private key).
  # The key is bind-mounted read-only; it is never copied into the repository.
  gcomc:
    profiles: ["gcomc"]
    image: satellite-downloader:latest
    working_dir: /workspace
    environment:
      GPORTAL_USERNAME: ${GPORTAL_USERNAME:-}
      # Raw HDF5 cache/archive used by src/gcomc.py (valid local files are reused, not re-downloaded).
      GCOMC_RAW_DIR: /gcomc_data/raw
    volumes:
      - ./:/workspace
      # Raw G-Portal HDF5 downloads live outside the repository.
      - ${GCOMC_HOST_DATA_PATH:-../satellite_image_downloader_gcomc_data}:/gcomc_data
      - type: bind
        source: ${GPORTAL_PRIVATE_KEY_HOST_PATH:-}
        target: /run/secrets/gportal_privatekey.key
        read_only: true
    command: ["python3", "-c", "print('specify a command')"]

volumes:
  satdl_model_cache:
  satdl_model_data:
